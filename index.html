<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engagement × PerthSanta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070707;
      --card: linear-gradient(165deg, #1a0808 0%, #0f0f0f 50%, #0a0a0a 100%);
      --card-hover: linear-gradient(165deg, #2a0a0a 0%, #141010 50%, #0a0a0a 100%);
      --border: #3f1a1a;
      --border-hover: #991b1b;
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #ef4444;
      --accent-soft: #f87171;
      --x-color: #e7e9ea;
      --ig-color: #e1306c;
      --radius: 16px;
      --shadow: 0 12px 28px rgba(185, 28, 28, 0.22);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== HERO – ảnh ngang + cắt nửa thân dưới ===== */
    .hero-wrap {
      max-width: 720px;
      margin: 12px auto 0;
      padding: 0 16px;
    }
    .hero {
      position: relative;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(127, 29, 29, 0.35);
      background: #000;
      aspect-ratio: 16 / 10;
    }
    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.25) 0%,
        rgba(0,0,0,0.05) 40%,
        rgba(0,0,0,0.55) 100%
      );
      pointer-events: none;
      z-index: 1;
    }
    .hero-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 18px;
      text-align: center;
      pointer-events: none;
    }
    .hero-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      letter-spacing: 0.02em;
      color: #fff;
      text-shadow: 0 2px 16px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.9);
      line-height: 1.15;
    }
    .hero-title span { color: var(--accent-soft); }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }
    section { margin-bottom: 36px; }
    .section-label {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      font-weight: 600;
    }

    /* ===== PLATFORM BUTTONS ===== */
    .platform-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .platform-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 22px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.25s ease;
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }
    .platform-btn::after {
      content: "";
      position: absolute;
      left: 20%;
      right: 20%;
      bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
      transition: opacity 0.25s;
    }
    .platform-btn:hover {
      background: var(--card-hover);
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }
    .platform-btn:hover::after { opacity: 1; }
    .platform-btn .icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      border: 1px solid var(--border);
    }
    .platform-btn[data-platform="x"] .icon-wrap { color: var(--x-color); }
    .platform-btn[data-platform="ig"] .icon-wrap { color: var(--ig-color); }
    .platform-btn svg { width: 24px; height: 24px; }

    /* ===== COMMENT GENERATORS ===== */
    .gen-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .gen-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
      background: linear-gradient(145deg, #2a0a0a 0%, #18181b 50%, #0c0c0c 100%);
      border: 1px solid #3f3f46;
      border-radius: var(--radius);
      color: #d4d4d8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      transition: all 0.25s ease;
    }
    .gen-btn:hover {
      border-color: var(--accent);
      color: #fff;
      background: linear-gradient(145deg, #450a0a 0%, #1c0909 50%, #0c0c0c 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(185, 28, 28, 0.2);
    }

    .footer-note {
      text-align: center;
      margin-top: 40px;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .footer-note strong { color: var(--accent-soft); }

    @media (max-width: 560px) {
      .hero-wrap { padding: 0 12px; margin-top: 10px; }
      .hero { border-radius: 16px; aspect-ratio: 16 / 11; }
      .hero-content { padding-top: 14px; }
      .platform-btn { padding: 18px 12px; }
      .gen-btn { padding: 16px 8px; font-size: 0.88rem; }
    }
  </style>
</head>
<body>

  <div class="hero-wrap">
    <header class="hero">
      <img src="picnuochoa.jpg" alt="PerthSanta" />
      <div class="hero-overlay" aria-hidden="true"></div>
      <div class="hero-content">
        <h1 class="hero-title">Engagement <span>×</span> PerthSanta</h1>
      </div>
    </header>
  </div>

  <main class="container">

    <section>
      <p class="section-label">COMMENT GENERATORS</p>
      <div class="gen-grid">
        <a class="gen-btn" href="https://perthsanta-captions-sparkle.lovable.app/" target="_blank" rel="noopener">Gen 1</a>
        <a class="gen-btn" href="https://perthsantaxralphclub.netlify.app/" target="_blank" rel="noopener">Gen 2</a>
        <a class="gen-btn" href="https://pixel-to-page-151.lovable.app/" target="_blank" rel="noopener">Gen 3</a>
      </div>
    </section>

    <section>
      <p class="section-label">Media Links</p>
      <div class="platform-row">
        <a href="x.html" class="platform-btn" data-platform="x">
          <div class="icon-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.792l7.73-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>
          </div>
          <span>X (Twitter)</span>
        </a>

        <a href="ig.html" class="platform-btn" data-platform="ig">
          <div class="icon-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
          </div>
          <span>Instagram</span>
        </a>
      </div>
    </section>

    <p class="footer-note">Made with ♡ for <strong>PerthSanta</strong></p>
  </main>

</body>
</html>
