<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Engagement × PerthSanta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0b;
      --card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #c9a87c;
      --x-color: #e7e9ea;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 24px;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--accent); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
    }
    .table-header h3 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.15rem;
      font-weight: 600;
    }
    .table-header .count {
      font-size: 0.78rem;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
      padding: 4px 10px;
      border-radius: 20px;
    }
    .guide-note {
      padding: 14px 18px;
      background: rgba(201, 168, 124, 0.08);
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.03em;
      text-align: center;
    }
    .guide-note span { display: inline-block; margin: 0 4px; }

    /* Keyword + Hashtag */
    .kw-box {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .kw-label {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .kw-content {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .copy-btn {
      align-self: flex-end;
      background: linear-gradient(145deg, rgba(201,168,124,0.25), rgba(201,168,124,0.1));
      border: 1px solid rgba(201,168,124,0.4);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background: linear-gradient(145deg, rgba(201,168,124,0.35), rgba(201,168,124,0.15));
      transform: translateY(-1px);
    }
    .copy-btn.copied {
      background: rgba(34, 197, 94, 0.2);
      border-color: rgba(34, 197, 94, 0.5);
      color: #4ade80;
    }

    .media-table { width: 100%; border-collapse: collapse; }
    .media-table thead th {
      text-align: left;
      padding: 12px 16px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
    }
    .media-table thead th.sortable { cursor: pointer; }
    .media-table thead th.sortable:hover { color: var(--accent); }
    .media-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.06); transition: background 0.2s; }
    .media-table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .media-table td { padding: 14px 16px; font-size: 0.9rem; vertical-align: middle; }
    .status-cell { width: 56px; text-align: center; font-size: 1.25rem; }
    .account-cell { display: flex; align-items: center; gap: 10px; }
    .account-cell .plat-icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.08); flex-shrink: 0;
      color: var(--x-color);
    }
    .account-cell .plat-icon svg { width: 15px; height: 15px; }
    .account-cell a {
      color: var(--text); text-decoration: none; font-weight: 500;
      transition: color 0.2s; word-break: break-all;
    }
    .account-cell a:hover { color: var(--accent); }
    .date-cell { width: 90px; color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  </style>
</head>
<body>
  <main class="container">
    <a href="index.html" class="back-btn">← Quay lại trang chủ</a>

    <div class="card">
      <div class="table-header">
        <h3>X (Twitter) · PerthSanta</h3>
        <span class="count" id="post-count">0 posts</span>
      </div>

      <!-- Hướng dẫn -->
      <div class="guide-note">
        <span>LIKE</span> · <span>CMT</span> · <span>REPOST</span> · <span>REQUOTE</span>
      </div>

      <!-- Keyword + Hashtag + Copy -->
      <div class="kw-box">
        <div class="kw-label">Keyword + Hashtag</div>
        <div class="kw-content" id="kw-text">PERTHSANTA RALPHS CLUB POPUP

#RalphLaurenFragrancesXPerthSanta</div>
        <button class="copy-btn" id="copy-btn">Copy KW + HS</button>
      </div>

      <table class="media-table">
        <thead>
          <tr>
            <th style="width:56px">Status</th>
            <th>Account</th>
            <th class="sortable" style="width:90px">Date <span class="sort-icon">↕</span></th>
          </tr>
        </thead>
        <tbody id="post-body"></tbody>
      </table>
    </div>
  </main>

  <script>
    // Copy button
    const copyBtn = document.getElementById('copy-btn');
    const kwText = document.getElementById('kw-text');

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(kwText.innerText);
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy KW + HS';
          copyBtn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        alert('Không copy được, hãy copy thủ công nhé');
      }
    });

    // Sort Date
    document.querySelectorAll('.sortable').forEach(th => {
      let asc = true;
      th.addEventListener('click', () => {
        const tbody = document.getElementById('post-body');
        const rows = Array.from(tbody.querySelectorAll('tr'));
        rows.sort((a, b) => {
          const dateA = a.dataset.date;
          const dateB = b.dataset.date;
          return asc ? dateA.localeCompare(dateB) : dateB.localeCompare(dateA);
        });
        rows.forEach(row => tbody.appendChild(row));
        asc = !asc;
        th.querySelector('.sort-icon').textContent = asc ? '↑' : '↓';
      });
    });

    // Load posts
    async function loadPosts() {
      try {
        const res = await fetch('data.json?v=' + Date.now());
        const data = await res.json();

        data.x.sort((a, b) => a.dateSort.localeCompare(b.dateSort));

        const tbody = document.getElementById('post-body');
        tbody.innerHTML = data.x.map(post => `
          <tr data-date="${post.dateSort}">
            <td class="status-cell">🚀</td>
            <td>
              <div class="account-cell">
                <div class="plat-icon">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.792l7.73-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>
                </div>
                <a href="${post.url}" target="_blank" rel="noopener">${post.title}</a>
              </div>
            </td>
            <td class="date-cell">${post.date}${post.time ? ' ' + post.time : ''}</td>
          </tr>
        `).join('');

        document.getElementById('post-count').textContent = `${data.x.length} posts`;
      } catch (err) {
        console.error('Lỗi load data.json:', err);
      }
    }

    loadPosts();
  </script>
</body>
</html>
